<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Messenger Multi-Lang</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --chat-bg: #0b1329;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --msg-out: #0284c7;
            --msg-in: #334155;
            --check-read: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --chat-bg: #e2e8f0;
            --text-color: #0f172a;
            --text-sub: #64748b;
            --accent: #0284c7;
            --msg-out: #38bdf8;
            --msg-in: #ffffff;
            --check-read: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container {
            width: 100%; max-width: 500px; height: 100vh; max-height: 800px;
            background: var(--panel-bg); display: flex; flex-direction: column;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Шапка */
        .header {
            padding: 12px 16px; background: var(--panel-bg); display: flex;
            align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 1.05rem; }
        .user-status { font-size: 0.8rem; color: var(--text-sub); transition: color 0.3s; }
        .user-status.online { color: #4ade80; }

        .controls { display: flex; gap: 8px; align-items: center; }
        select, button {
            background: var(--bg-color); color: var(--text-color); border: 1px solid var(--text-sub);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }

        /* Область чата */
        .chat-box {
            flex: 1; background: var(--chat-bg); padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .message {
            max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 0.95rem;
            position: relative; word-wrap: break-word; display: flex; flex-direction: column;
        }
        .message.out { align-self: flex-end; background: var(--msg-out); color: #fff; border-bottom-right-radius: 2px; }
        .message.in { align-self: flex-start; background: var(--msg-in); color: var(--text-color); border-bottom-left-radius: 2px; }

        .msg-meta {
            display: flex; align-items: center; justify-content: flex-end; gap: 4px;
            font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-top: 4px;
        }
        .message.in .msg-meta { color: var(--text-sub); }
        .ticks { font-weight: bold; font-size: 0.85rem; }
        .ticks.read { color: var(--check-read); }

        /* Вложения */
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
        audio { max-width: 200px; height: 32px; margin-top: 4px; }

        /* Панель ввода */
        .input-panel {
            padding: 10px; background: var(--panel-bg); display: flex; gap: 8px; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-panel input[type="text"] {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--text-sub);
            background: var(--bg-color); color: var(--text-color); outline: none;
        }

        /* RTL Стили для Арабского */
        [dir="rtl"] .message.out { align-self: flex-start; border-bottom-right-radius: 12px; border-bottom-left-radius: 2px; }
        [dir="rtl"] .message.in { align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
        [dir="rtl"] .msg-meta { justify-content: flex-start; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- Шапка -->
    <div class="header">
        <div class="user-info">
            <span class="user-name" id="chat-title">Alex</span>
            <span class="user-status" id="user-status">...</span>
        </div>
        <div class="controls">
            <!-- Выбор из 5 языков -->
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="ru">RU</option>
                <option value="tt">TT</option>
                <option value="tr">TR</option>
                <option value="en">EN</option>
                <option value="ar">AR</option>
            </select>
            <button onclick="toggleTheme()">🌓</button>
            <button onclick="toggleOnline()" id="btn-toggle-online">🌐</button>
        </div>
    </div>

    <!-- Чат -->
    <div class="chat-box" id="chat-box"></div>

    <!-- Панель ввода -->
    <div class="input-panel">
        <label>
            📷 <input type="file" id="img-input" accept="image/*" style="display:none" onchange="sendImage(this)">
        </label>
        <button id="btn-voice" onclick="toggleVoiceRecord()">🎙️</button>
        <input type="text" id="msg-input" placeholder="..." onkeydown="if(event.key==='Enter') sendTextMessage()">
        <button id="btn-send" onclick="sendTextMessage()">➔</button>
    </div>
</div>

<script>
    // 1. Словарь на 5 языков
    const i18n = {
        ru: {
            title: "Собеседник",
            online: "В сети",
            offline: "Был(а) в сети недавно",
            placeholder: "Сообщение...",
            send: "Отправить",
            voiceRecording: "Запись...",
            dir: "ltr"
        },
        tt: {
            title: "Сөйләшүче",
            online: "Онлайнда",
            offline: "Яңаларда онлайнда иде",
            placeholder: "Хәбәр...",
            send: "Ибәрү",
            voiceRecording: "Яздыру...",
            dir: "ltr"
        },
        tr: {
            title: "Sohbetçi",
            online: "Çevrimiçi",
            offline: "Son görülme yakınlarda",
            placeholder: "Mesaj...",
            send: "Gönder",
            voiceRecording: "Kaydediliyor...",
            dir: "ltr"
        },
        en: {
            title: "Peer",
            online: "Online",
            offline: "Last seen recently",
            placeholder: "Message...",
            send: "Send",
            voiceRecording: "Recording...",
            dir: "ltr"
        },
        ar: {
            title: "المستخدم",
            online: "متصل",
            offline: "آخر ظهور كان قريبًا",
            placeholder: "اكتب رسالة...",
            send: "إرسال",
            voiceRecording: "جاري التسجيل...",
            dir: "rtl"
        }
    };

    let currentLang = 'ru';
    let isOnline = true;
    let offlineQueue = [];
    let mediaRecorder, audioChunks = [], isRecording = false;

    // Смена языка
    function changeLanguage(lang) {
        currentLang = lang;
        const data = i18n[lang];
        
        document.documentElement.setAttribute('dir', data.dir);
        document.getElementById('chat-title').innerText = data.title;
        document.getElementById('msg-input').placeholder = data.placeholder;
        
        updateStatusUI();
    }

    // Переключение онлайн/оффлайн
    function toggleOnline() {
        isOnline = !isOnline;
        updateStatusUI();
        if (isOnline) {
            flushOfflineQueue();
        }
    }

    function updateStatusUI() {
        const statusEl = document.getElementById('user-status');
        const data = i18n[currentLang];
        if (isOnline) {
            statusEl.innerText = data.online;
            statusEl.classList.add('online');
        } else {
            statusEl.innerText = data.offline;
            statusEl.classList.remove('online');
        }
    }

    // Переключение темы
    function toggleTheme() {
        const app = document.getElementById('app');
        const isDark = app.getAttribute('data-theme') !== 'light';
        app.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    // Отрисовка сообщения
    function appendMessage(content, type = 'text', isOut = true, status = 'sent') {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isOut ? 'out' : 'in'}`;

        let bodyHTML = '';
        if (type === 'text') bodyHTML = `<span>${content}</span>`;
        if (type === 'image') bodyHTML = `<img src="${content}" class="msg-img">`;
        if (type === 'audio') bodyHTML = `<audio controls src="${content}"></audio>`;

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Галочки: sent (✓), delivered (✓✓ grey), read (✓✓ blue)
        let ticksHTML = '';
        if (isOut) {
            let tickSymbol = '✓';
            let readClass = '';
            if (status === 'delivered') tickSymbol = '✓✓';
            if (status === 'read') { tickSymbol = '✓✓'; readClass = 'read'; }
            ticksHTML = `<span class="ticks ${readClass}">${tickSymbol}</span>`;
        }

        msgDiv.innerHTML = `${bodyHTML}
            <div class="msg-meta">
                <span>${timeStr}</span>
                ${ticksHTML}
            </div>`;

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    // Отправка текстового сообщения
    function sendTextMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';

        if (!isOnline) {
            // Если оффлайн — кладем в очередь
            const msgNode = appendMessage(text, 'text', true, 'sent');
            offlineQueue.push({ node: msgNode, type: 'text' });
        } else {
            // Если онлайн — сразу имитируем доставку и прочтение
            const msgNode = appendMessage(text, 'text', true, 'sent');
            simulateDeliveryAndRead(msgNode);
        }
    }

    // Симуляция смены статуса (доставлено -> прочитано)
    function simulateDeliveryAndRead(msgNode) {
        setTimeout(() => {
            const ticks = msgNode.querySelector('.ticks');
            if (ticks) ticks.innerText = '✓✓';
        }, 1000);

        setTimeout(() => {
            const ticks = msgNode.querySelector('.ticks');
            if (ticks) {
                ticks.innerText = '✓✓';
                ticks.classList.add('read');
            }
        }, 2500);
    }

    // Отправка накопившейся очереди при выходе в онлайн
    function flushOfflineQueue() {
        while (offlineQueue.length > 0) {
            const item = offlineQueue.shift();
            simulateDeliveryAndRead(item.node);
        }
    }

    // Отправка картинки
    function sendImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const msgNode = appendMessage(e.target.result, 'image', true, isOnline ? 'sent' : 'sent');
                if (isOnline) simulateDeliveryAndRead(msgNode);
                else offlineQueue.push({ node: msgNode });
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Запись голоса
    async function toggleVoiceRecord() {
        const btn = document.getElementById('btn-voice');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const msgNode = appendMessage(audioUrl, 'audio', true, isOnline ? 'sent' : 'sent');
                    if (isOnline) simulateDeliveryAndRead(msgNode);
                    else offlineQueue.push({ node: msgNode });
                };
                mediaRecorder.start();
                isRecording = true;
                btn.style.background = '#ef4444';
            } catch(e) {
                alert("Ошибка доступа к микрофону");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.style.background = '';
        }
    }

    // Инициализация при старте
    changeLanguage('ru');
</script>
</body>
</html>
